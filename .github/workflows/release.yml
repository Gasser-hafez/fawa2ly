name: Release

# Pushing a tag such as v0.1.0 builds the Windows installer and publishes it as a GitHub release.
# Run it by hand (Actions > Release > Run workflow) to build the installer without publishing.
#
# The release also carries what the installed app needs to update itself (src-tauri/src/update.rs):
# the installer's signature (.sig) and latest.json, which names the version, its notes and where
# the installer is. The app reads latest.json from the latest release, so releases are published as
# latest, not as pre-releases: GitHub leaves pre-releases out of /releases/latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      # No git credentials left in .git/config for the steps after this one (npm, pip and the build
      # run here too); publishing uses the action's own token, not git.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The tag has to name the version the app reports; otherwise every install would see itself
      # as out of date and offer the same update forever.
      - name: Version
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like "refs/tags/v*" -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME does not match version $v in app/src-tauri/tauri.conf.json"
          }
          "VERSION=$v" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      # Updates are signed: the app installs nothing whose signature does not match its public key.
      # The secrets are tried here, by signing a scratch file, so a key or password pasted wrong fails
      # in seconds and says why, instead of at the end of a 15-minute build. Errors here and in the
      # build are also written as annotations, which GitHub shows without signing in (job logs it
      # does not), so a failed release can be read from the run page or the API.
      - name: Signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Output "::error title=Signing key::Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (docs/RELEASING.md)."
            exit 1
          }
          "key check" | Out-File -Encoding ascii key-check.txt
          $out = (npx --yes @tauri-apps/cli@2.11.4 signer sign key-check.txt 2>&1) -join "`n"
          if ($LASTEXITCODE) {
            $why = ($out -split "`n" | Where-Object { $_ -match "rror" } | Select-Object -Last 1).Trim()
            Write-Output "::error title=Signing key::The signing secrets do not work: $why. Re-add both from %USERPROFILE%\.tauri (docs/RELEASING.md)."
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      # Nothing is built from a tree whose tests fail.
      - run: python -m pytest -q

      # The engine, frozen. Then the same health check a user can run from the install folder:
      # it is how a library whose binary was not collected shows up before a user finds it.
      - run: python -m PyInstaller packaging/fawa2ly-engine.spec --noconfirm
      - run: dist/fawa2ly-engine/fawa2ly-engine.exe doctor --offline

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app

      - name: Build the installer
        shell: pwsh
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --config src-tauri/tauri.bundle.json 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE) {
            $tail = (Get-Content build.log -Tail 30 | Where-Object { $_.Trim() }) -join "%0A"
            Write-Output "::error title=tauri build failed::$tail"
            exit 1
          }

      - name: Checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer was produced" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -Encoding ascii "$($setup.FullName).sha256"
          "SETUP=$($setup.FullName)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Release notes and latest.json
        shell: pwsh
        run: |
          $setup = Get-Item $env:SETUP
          $sig = "$($setup.FullName).sig"
          if (-not (Test-Path $sig)) { throw "no update signature was produced next to $($setup.Name)" }
          python packaging/release_notes.py $env:VERSION | Out-File -Encoding utf8 notes.md
          $latest = [ordered]@{
            version   = $env:VERSION
            notes     = (Get-Content notes.md -Raw).Trim()
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content $sig -Raw).Trim()
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION/$($setup.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 latest.json
          Get-Content latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: fawa2ly-windows-installer
          path: |
            ${{ env.SETUP }}
            ${{ env.SETUP }}.sha256
            ${{ env.SETUP }}.sig
            latest.json

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Fawa2ly ${{ github.ref_name }}
          body_path: notes.md
          prerelease: false         # the app looks for updates in the latest release only
          make_latest: true
          files: |
            ${{ env.SETUP }}
            ${{ env.SETUP }}.sha256
            ${{ env.SETUP }}.sig
            latest.json
