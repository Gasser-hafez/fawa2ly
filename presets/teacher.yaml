name: teacher
mode: interview
category: Education
title: Teacher or trainer
role: Teacher or trainer
focus:
  - a lesson or a student that did not go to plan, and what they changed
  - how they check that students actually learned
  - a difficult class, or a difficult conversation with a parent
  - subjects, levels and curricula as in their background
avoid:
  - a general love of teaching with no example behind it
  - criticising students, parents or former schools
