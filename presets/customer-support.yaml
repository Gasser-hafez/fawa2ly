name: customer-support
mode: interview
category: Sales and customer service
title: Customer support
role: Customer support or customer success agent
focus:
  - a difficult customer and how the situation ended
  - how they find the real problem behind a complaint
  - the ticketing tools and response habits they worked with
  - what they did so the same issue would not come back
avoid:
  - blaming the customer
  - promising what the company's policy does not allow
