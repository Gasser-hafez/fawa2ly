name: video-editor
mode: interview
category: Design and creative
title: Video editor or motion designer
role: Video editor or motion graphics designer
focus:
  - a video they edited, its goal, length and platform
  - story, pacing and sound choices
  - tools such as Premiere or After Effects tied to a project
  - delivering versions on deadline
avoid:
  - software lists with no project
  - ignoring the audience or the platform
