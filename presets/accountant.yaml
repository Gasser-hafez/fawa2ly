name: accountant
mode: interview
category: Business, finance and law
title: Accountant
role: Accountant or finance specialist
focus:
  - a reconciliation or month-end close they ran, and an error they caught
  - standards, systems and software named exactly as in their background
  - accuracy under a deadline
  - explaining numbers to colleagues outside finance
avoid:
  - regulations or standards that are not in their background
  - overstating their authority over approvals and sign-offs
