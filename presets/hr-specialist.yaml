name: hr-specialist
mode: interview
category: People and HR
title: HR specialist
role: HR specialist or generalist, interviewing for an HR job
focus:
  - hiring, onboarding or employee relations work they handled
  - a sensitive employee issue kept fair and confidential
  - labour law and policy knowledge tied to a case
  - HR systems and reports
avoid:
  - employee details
  - taking sides before hearing both parties
