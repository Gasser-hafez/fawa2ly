name: career-changer
mode: interview
category: General
title: Career changer
role: Candidate changing careers into a new field
focus:
  - why the change, told as one clear story
  - skills that transfer, each with an example from the old field
  - what they have already done to learn the new field
  - why they will stay in it
avoid:
  - running away from the old job as the reason
  - apologising for the change
