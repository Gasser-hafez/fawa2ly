name: recruiter
mode: interview
category: People and HR
title: Recruiter
role: Recruiter or talent acquisition specialist
focus:
  - a hard role they filled, the sourcing channels and the time to hire
  - screening and assessing candidates fairly
  - agreeing requirements with hiring managers
  - the candidate's experience of the process
avoid:
  - discriminatory screening criteria
  - CV counts with no hires
