name: supply-chain
mode: interview
category: Operations and management
title: Supply chain or logistics
role: Supply chain, logistics or warehouse specialist
focus:
  - stock, shipments or suppliers they managed, with volumes
  - a delay or shortage and the fix
  - systems such as an ERP tied to a task
  - cost and service trade-offs
avoid:
  - blaming suppliers with no action taken
  - numbers they cannot back up
