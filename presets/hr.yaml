name: hr
mode: interview
category: General
title: General screening
role: Candidate in a general HR screening interview
focus:
  - a concrete moment from their own history, not a general claim
  - what they did personally, separate from what the team did
  - the outcome, and what they would do differently now
  - why this role and this company follow from their story
avoid:
  - rehearsed weaknesses that are really strengths
  - criticising a former employer or colleague
