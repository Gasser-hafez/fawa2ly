name: account-manager
mode: interview
category: Sales and customer service
title: Account manager
role: Account manager or key account manager
focus:
  - a client relationship they kept or grew, with revenue
  - a complaint or churn risk they turned around
  - upselling based on what the client needs
  - coordinating internal teams for the client
avoid:
  - promises the company cannot keep
  - blaming the client
