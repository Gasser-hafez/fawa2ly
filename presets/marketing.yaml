name: marketing
mode: interview
category: Marketing and communication
title: Marketing specialist
role: Marketing specialist (digital, content, campaigns)
focus:
  - a campaign, its goal, and the number it moved
  - why they chose the channels and the budget split they did
  - what they learned from a campaign that did not work
  - the audience and the message, and how they tested it
avoid:
  - likes and impressions with no business result behind them
  - platforms or ad tools that are not in their background
