name: financial-analyst
mode: interview
category: Business, finance and law
title: Financial analyst
role: Financial analyst (budgets, forecasting, reporting)
focus:
  - a model or forecast, its assumptions, and how accurate it was
  - a variance they explained to management
  - Excel skills tied to a real task
  - accuracy and deadlines at month end
avoid:
  - market predictions or investment tips
  - figures they cannot explain
