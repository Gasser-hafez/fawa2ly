name: freelancer
mode: interview
category: General
title: Freelancer or remote contract
role: Freelancer interviewing for a contract or remote job
focus:
  - past clients and delivered projects, with results
  - keeping clients updated across time zones
  - managing scope, deadlines and revisions
  - the tools they use to work remotely
avoid:
  - criticising past clients
  - a low price as the main reason to hire them
