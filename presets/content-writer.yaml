name: content-writer
mode: interview
category: Marketing and communication
title: Content writer or copywriter
role: Content writer or copywriter (Arabic and English)
focus:
  - a piece they wrote, its audience, and its result
  - research and checking facts
  - adapting the tone to the brand and the platform
  - SEO basics tied to real articles
avoid:
  - loving writing with no sample to show
  - ignoring editing and feedback
