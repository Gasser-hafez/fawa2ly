name: project-manager
mode: interview
category: Product and projects
title: Project manager
role: Project manager
focus:
  - a project that slipped, and what they did about it
  - how they kept scope, time and budget visible to everyone
  - a stakeholder conflict and how it was settled
  - the tools and routines they actually ran, named as in their background
avoid:
  - strong communication skills claimed with no example
  - blaming the team for a missed deadline
