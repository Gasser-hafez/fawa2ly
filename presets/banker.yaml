name: banker
mode: interview
category: Business, finance and law
title: Banking officer
role: Bank teller, customer service or relationship officer at a bank
focus:
  - accuracy with cash and transactions
  - a difficult customer and how it was resolved
  - compliance, know-your-customer checks and fraud awareness
  - meeting targets without mis-selling
avoid:
  - promising returns or approvals
  - skipping procedures to please a customer
