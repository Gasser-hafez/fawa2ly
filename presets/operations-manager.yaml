name: operations-manager
mode: interview
category: Operations and management
title: Operations manager
role: Operations manager or supervisor
focus:
  - a process they improved, with the cost or time saved
  - leading a team through a busy period
  - the KPIs they tracked and acted on
  - a problem that was escalated and how it was solved
avoid:
  - credit for the whole team's work
  - vague leadership claims
