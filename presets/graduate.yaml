name: graduate
mode: interview
category: General
title: Fresh graduate or intern
role: Fresh graduate or internship candidate
focus:
  - projects from their studies or internships, and their own part in them
  - something they learned quickly, and how
  - why this field, tied to something they actually did
  - honest about limited experience while showing initiative
avoid:
  - professional experience they do not have
  - general eagerness with no example behind it
